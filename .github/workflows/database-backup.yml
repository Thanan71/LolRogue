name: Database backup

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create logical database backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_DIRECTORY: database-backup
        run: |
          LOLROGUE_PROJECT_REF=$(node --input-type=module -e "import { resolveDeploymentTarget } from './scripts/lib/environment-config.mjs'; const target = resolveDeploymentTarget(process.env.GITHUB_REF_NAME); if (!target) process.exit(1); process.stdout.write(target.projectRef);")
          npm run release -- backup --project-ref "$LOLROGUE_PROJECT_REF"

      - name: Verify backup checksums
        working-directory: database-backup
        run: sha256sum -c SHA256SUMS

      - name: Upload encrypted GitHub artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-backup-${{ github.run_id }}
          path: database-backup/
          if-no-files-found: error
          retention-days: 30
