name: Authority balance cohorts

on:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      profile:
        description: Cohort volume to execute
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release

permissions:
  contents: read

concurrency:
  group: authority-balance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify versioned balance artifacts
        run: npm run balance:artifacts:check

      - name: Select cohort volume
        id: volume
        env:
          DISPATCH_PROFILE: ${{ inputs.profile }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) profile=pr ;;
            schedule) profile=nightly ;;
            release) profile=release ;;
            workflow_dispatch) profile="$DISPATCH_PROFILE" ;;
            *) exit 2 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Run versioned authority cohorts
        run: >-
          npm run balance:cohort --
          --profile "${{ steps.volume.outputs.profile }}"
          --output-directory balance-report

      - name: Upload reports and extreme seed traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authority-balance-${{ steps.volume.outputs.profile }}-${{ github.run_id }}
          path: balance-report/
          if-no-files-found: error
          retention-days: 30
