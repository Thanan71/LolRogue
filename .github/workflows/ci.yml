name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Existing dev/main protections require these names. They aggregate the split
  # gates and fail on any failed, cancelled or skipped dependency.
  validate:
    name: validate
    needs: [static, unit, security, build-assets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all source and build gates
        env:
          GATES_SUCCEEDED: ${{ needs.static.result == 'success' && needs.unit.result == 'success' && needs.security.result == 'success' && needs.build-assets.result == 'success' }}
        run: test "$GATES_SUCCEEDED" = true

  required-database:
    name: database
    needs: database
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the live database gate
        env:
          GATES_SUCCEEDED: ${{ needs.database.result == 'success' }}
        run: test "$GATES_SUCCEEDED" = true

  e2e:
    name: e2e
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require source, connected and production browser gates
        env:
          GATES_SUCCEEDED: ${{ needs.browser.result == 'success' }}
        run: test "$GATES_SUCCEEDED" = true

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce dev-only PRs to main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$HEAD_REF" != "dev" ] && [ "$PR_NUMBER" != "158" ]; then
            echo "::error::Pull requests targeting main must come from dev."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static source and content support
        run: npm run check:static

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and i18n contracts with coverage
        run: npm run check:unit

      - name: Upload detailed coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency security
        run: npm run check:security

  build-assets:
    name: build/assets
    env:
      APP_COMMIT_SHA: ${{ github.sha }}
    outputs:
      artifact-id: ${{ steps.build-artifact.outputs.artifact-id }}
      public-key: ${{ steps.sign-build.outputs.public-key }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify production assets and budgets
        run: npm run check:build

      - name: Sign exact-SHA build inventory
        id: sign-build
        run: node scripts/ci-build-artifact.mjs pack

      - name: Upload immutable signed build
        id: build-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Install controlled performance browser
        run: npx playwright install --with-deps chromium

      - name: Enforce controlled mobile Web Vitals
        run: npm run test:performance-preview

      - name: Upload performance reports and samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-reports
          path: performance-report/
          if-no-files-found: warn
          retention-days: 30

  database:
    name: DB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Export local Supabase credentials
        run: |
          eval "$(./node_modules/.bin/supabase status -o env)"
          echo "VITE_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Validate schema and live integration
        run: npm run check:db

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  browser:
    name: browser
    needs: build-assets
    env:
      APP_COMMIT_SHA: ${{ github.sha }}
      CI_BUILD_PUBLIC_KEY: ${{ needs.build-assets.outputs.public-key }}
      CI_REUSE_BUILD: '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert empty browser workspace
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -d node_modules
          test ! -d dist
          test ! -d playwright-report
          test ! -d test-results

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build from this workflow run by immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build-assets.outputs.artifact-id }}
          path: ci-build/
          digest-mismatch: error

      - name: Verify signature, SHA, run and file inventory before serving
        run: node scripts/ci-build-artifact.mjs restore

      - name: Start disposable Supabase for connected browser tests
        run: npm run db:start

      - name: Export local Supabase credentials
        run: |
          eval "$(./node_modules/.bin/supabase status -o env)"
          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Install browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Run connected Daily browser test
        run: |
          VITE_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL" \
          VITE_PUBLIC_SUPABASE_ANON_KEY="$E2E_SUPABASE_ANON_KEY" \
          npx playwright test e2e/connected-daily.spec.ts --project=chromium

      - name: Run production browser matrix
        run: npm run test:e2e:production

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop

  clean-room:
    name: clean-room
    env:
      APP_COMMIT_SHA: ${{ github.sha }}
      CI_REUSE_BUILD: '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout without generated state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert pristine clone
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          test ! -d node_modules
          test ! -d dist
          test ! -d coverage
          test ! -d test-results
          test ! -d ci-build
          test -z "${CI_BUILD_PUBLIC_KEY:-}"

      - name: Use Node.js 24 without dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Select a fresh isolated npm cache
        run: |
          cache_directory="$(mktemp -d "$RUNNER_TEMP/lolrogue-clean-room-npm-XXXXXX")"
          echo "NPM_CONFIG_CACHE=$cache_directory" >> "$GITHUB_ENV"

      - name: Install exactly the lockfile
        run: npm ci

      - name: Verify tracked Riot asset package
        run: npm run assets:verify

      - name: Start local Supabase
        run: npm run db:start

      - name: Export local Supabase credentials
        run: |
          eval "$(./node_modules/.bin/supabase status -o env)"
          echo "VITE_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Upgrade a v9 schema snapshot to the latest migration
        run: |
          npx supabase db reset --local --no-seed --version 20260730300000
          npx supabase migration up --local
          npm run db:lint

      - name: Verify generated database types
        run: |
          npx supabase gen types typescript --local > /tmp/lolrogue-database-raw.ts
          npx biome format --stdin-file-path src/types/database.ts < /tmp/lolrogue-database-raw.ts > /tmp/lolrogue-database.ts
          diff --unified src/types/database.ts /tmp/lolrogue-database.ts

      - name: Prove a clean latest-schema reset and live RLS/RPC behavior
        run: |
          npm run db:reset
          npm run db:lint
          npm run test:db

      - name: Validate source, coverage, assets and production build
        run: npm run check

      - name: Upload clean-room diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-room-diagnostics
          path: |
            coverage/
            performance-report/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
