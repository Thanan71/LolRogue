name: One-off TODO i18n P0 update

on:
  push:
    branches:
      - feat/english-i18n
    paths:
      - .github/workflows/oneoff-todo-i18n-p0.yml

permissions:
  contents: write

jobs:
  update-todo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/english-i18n
          fetch-depth: 0

      - name: Update TODO
        run: python3 scripts/oneoff-update-todo-i18n-p0.py

      - name: Remove one-off helpers
        run: |
          rm .github/workflows/oneoff-todo-i18n-p0.yml
          rm scripts/oneoff-update-todo-i18n-p0.py

      - name: Commit TODO update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md .github/workflows/oneoff-todo-i18n-p0.yml scripts/oneoff-update-todo-i18n-p0.py
          git commit -m "docs(todo): promote full project internationalization to P0"
          git push origin HEAD:feat/english-i18n
